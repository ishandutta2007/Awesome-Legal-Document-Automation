<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a">
        <animate attributeName="stop-color" values="#0f172a;#1e1b4b;#0f172a" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#1e293b">
        <animate attributeName="stop-color" values="#1e293b;#311b92;#1e293b" dur="10s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Pattern overlay -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="300" y1="0" x2="300" y2="320" />
    <line x1="600" y1="0" x2="600" y2="320" />
    <line x1="900" y1="0" x2="900" y2="320" />
  </g>

  <!-- Animated Glowing Accent Orbs -->
  <circle cx="150" cy="100" r="80" fill="#38bdf8" opacity="0.15" filter="url(#glow)">
    <animate attributeName="cy" values="100;120;100" dur="6s" repeatCount="indefinite" />
  </circle>
  <circle cx="1050" cy="220" r="100" fill="#c084fc" opacity="0.15" filter="url(#glow)">
    <animate attributeName="cy" values="220;200;220" dur="7s" repeatCount="indefinite" />
  </circle>

  <!-- Scale Icon / Logo -->
  <g transform="translate(100, 85)" fill="none" stroke="url(#textGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <!-- Scales of Justice Icon -->
    <path d="M 50 20 L 50 130 M 20 130 L 80 130 M 10 40 L 90 40 M 10 40 L 25 80 M 10 40 L -5 80 M 90 40 L 105 80 M 90 40 L 75 80" />
    <path d="M -15 80 Q 10 100 35 80 Z" fill="url(#textGrad)" fill-opacity="0.2"/>
    <path d="M 65 80 Q 90 100 115 80 Z" fill="url(#textGrad)" fill-opacity="0.2"/>
  </g>

  <!-- Title Text -->
  <text x="260" y="130" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="52" fill="url(#textGrad)">
    Awesome Legal Document Automation
  </text>
  
  <!-- Subtitle -->
  <text x="265" y="180" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="22" fill="#94a3b8">
    Curated Platforms • Document Assembly • Rules-as-Code • Legal AI • Open-Source
  </text>

  <!-- Tech Badges inside banner -->
  <g transform="translate(265, 215)" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">
    <rect x="0" y="0" width="130" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="65" y="21" fill="#38bdf8" text-anchor="middle">⚖️ LegalTech</text>

    <rect x="145" y="0" width="150" height="32" rx="16" fill="#1e293b" stroke="#818cf8" stroke-width="1"/>
    <text x="220" y="21" fill="#818cf8" text-anchor="middle">📄 Assembly</text>

    <rect x="310" y="0" width="140" height="32" rx="16" fill="#1e293b" stroke="#c084fc" stroke-width="1"/>
    <text x="380" y="21" fill="#c084fc" text-anchor="middle">🤖 Legal AI</text>

    <rect x="465" y="0" width="160" height="32" rx="16" fill="#1e293b" stroke="#34d399" stroke-width="1"/>
    <text x="545" y="21" fill="#34d399" text-anchor="middle">🔓 Open-Source</text>
  </g>
</svg>
